# Local Postgres only (doc 09, doc 16). Deployed database is Neon; nothing here runs in production.
# A V1/Future Python service attaches under `profiles: [services]` so `pnpm dev` is unchanged (services/README.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: grasp-postgres
    environment:
      POSTGRES_DB: grasp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # 5433 on the host: a natively installed Postgres often holds 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grasp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # V1 local tutor model (doc 07, locked position 7). Opt-in: `pnpm tutor:up`; `pnpm db:up` does not start it.
  # The MVP tutor stays TUTOR_ENGINE=template; this only lets the V1 local-model path be measured.
  ollama:
    image: ollama/ollama:latest
    container_name: grasp-ollama
    profiles: [tutor]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Browser database UI (CloudBeaver Community, free): http://localhost:8978. Opt-in: `pnpm db:ui`.
  # Dev only: bound to 127.0.0.1, anonymous access to the one preconfigured local connection (the same
  # postgres/postgres credentials as above). Never point it at Neon or any database holding participant data
  # outside this machine. The connection file is copied into the workspace on first start only.
  cloudbeaver:
    image: dbeaver/cloudbeaver:24.3.0
    container_name: grasp-cloudbeaver
    profiles: [dbui]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CB_SERVER_NAME: Grasp local DB
      CB_SERVER_URL: http://localhost:8978
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: Grasp-local-1
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver:/opt/cloudbeaver/workspace
      - ./cloudbeaver-data-sources.json:/opt/cloudbeaver/conf/initial-data-sources.conf:ro

volumes:
  pgdata:
  ollama:
  cloudbeaver:
