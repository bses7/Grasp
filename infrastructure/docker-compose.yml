# Local Postgres only (doc 09, doc 16). Deployed database is Neon; nothing here runs in production.
# A V1/Future Python service attaches under `profiles: [services]` so `pnpm dev` is unchanged (services/README.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: grasp-postgres
    environment:
      POSTGRES_DB: grasp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grasp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # V1 local tutor model (doc 07, locked position 7). Opt-in: `pnpm tutor:up`; `pnpm db:up` does not start it.
  # The MVP tutor stays TUTOR_ENGINE=template; this only lets the V1 local-model path be measured.
  ollama:
    image: ollama/ollama:latest
    container_name: grasp-ollama
    profiles: [tutor]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  ollama:
