name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from the packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm content:validate

      - name: GLB size budget (5 MB per model, locked position 6)
        run: |
          if [ -d models ]; then
            big=$(find models -type f -size +5242880c)
            if [ -n "$big" ]; then
              echo "Files under models/ exceed 5 MB:"
              echo "$big"
              exit 1
            fi
          fi
          echo "models/ within budget"
